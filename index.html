<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CK Brasil | Suprimentos Industriais</title>

    <!-- PWA & Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0000">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Splash Screen / Gatilho da Música -->
    <div id="splash-screen" onclick="startApp()">
        <div class="splash-content">
            <img src="assets/logo.png" class="splash-logo">
            <div class="loading-bar"><div class="progress"></div></div>
            <p class="loading-text">CLIQUE PARA ENTRAR</p>
        </div>
    </div>

    <!-- Controle de Som -->
    <div id="music-control" onclick="toggleMusic()">
        <i class="fas fa-volume-up" id="music-icon"></i>
    </div>
    <audio id="bg-music" loop>
        <source src="assets/musica.mp3" type="audio/mpeg">
    </audio>

    <div class="carbon-bg"></div>

    <main class="main-card hidden-start">
        <div class="screw top-left"></div>
        <div class="screw top-right"></div>
        <div class="screw bottom-left"></div>
        <div class="screw bottom-right"></div>

        <div class="content-wrapper">
            <section class="brand-section">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="CK Brasil" class="main-logo">
                    <div class="neon-line"></div>
                    <p class="tagline">SOLUÇÕES E SUPRIMENTOS DE <span>ALTA PERFORMANCE</span></p>
                </div>
            </section>

            <section class="info-section">
                <div class="about-box">
                    <p class="welcome-text">
                        Na <span class="red-text">CK Brasil</span>, oferecemos alta qualidade em Discos, Brocas, Máquinas e EPIs. Precisão que eleva seus projetos.
                    </p>
                </div>

                <div class="divider-container">
                    <div class="line"></div>
                    <span>CONTATO RÁPIDO</span>
                    <div class="line"></div>
                </div>

                <nav class="icons-grid">
                    <a href="https://api.whatsapp.com/send?phone=5511954627266&text=Olá,%20vi%20o%20cartão%20virtual" class="icon-btn">
                        <i class="fab fa-whatsapp"></i><span>WHATSAPP</span>
                    </a>
                    <a href="https://ckbrasil.com.br" class="icon-btn">
                        <i class="fas fa-globe"></i><span>WEBSITE</span>
                    </a>
                    <a href="tel:11954627266" class="icon-btn">
                        <i class="fas fa-phone-alt"></i><span>CHAMADA</span>
                    </a>
                    <a href="mailto:danielle.cordeiro@ckbrasil.com.br?subject=Contato%20Virtual&body=Olá%20Danielle,%20gostaria%20de%20mais%20informações." class="icon-btn">
                        <i class="far fa-envelope"></i><span>E-MAIL</span>
                    </a>
                    <a href="https://www.instagram.com/ckbrasiloficial/" class="icon-btn">
                        <i class="fab fa-instagram"></i><span>INSTAGRAM</span>
                    </a>
                    <a href="https://www.google.com.br/maps/place/Rua+Portela+de+G%C3%B3is,+225" class="icon-btn" target="_blank">
                        <i class="fas fa-map-marker-alt"></i><span>ENDEREÇO</span>
                    </a>
                </nav>

                <button onclick="downloadVCard()" class="save-btn">SALVAR NA AGENDA</button>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
